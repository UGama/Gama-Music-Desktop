<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gama Music">
  <title>Gama Music</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=29">
  <link rel="icon" href="./assets/icon.svg?v=29" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=29">
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="./assets/icon.svg?v=29" alt="" width="40" height="40">
        <div>
          <p class="brand-name">Gama Music</p>
          <p class="brand-subtitle" id="connectionText">正在连接 Mac 服务</p>
        </div>
      </div>
      <button class="icon-button" id="settingsButton" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 8.7a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Zm8 3.3c0 .5 0 1-.1 1.5l2 1.5-2 3.5-2.4-1a8.2 8.2 0 0 1-2.6 1.5l-.3 2.6h-4l-.3-2.6a8.2 8.2 0 0 1-2.6-1.5l-2.4 1-2-3.5 2-1.5A9.8 9.8 0 0 1 4 12c0-.5 0-1 .1-1.5l-2-1.5 2-3.5 2.4 1A8.2 8.2 0 0 1 9.1 5l.3-2.6h4l.3 2.6a8.2 8.2 0 0 1 2.6 1.5l2.4-1 2 3.5-2 1.5c.2.5.3 1 .3 1.5Z" />
        </svg>
      </button>
    </header>

    <main>
      <section class="download-panel" aria-labelledby="downloadTitle">
        <div class="single-download-card">

          <div class="single-download-heading">
            <div>
              <p class="eyebrow">Bilibili Video</p>

              <h2 id="downloadTitle">
                下载单个视频
              </h2>

              <p>
                输入 B站视频链接，可使用视频标题或自行修改歌名
              </p>
            </div>

            <span class="library-count" id="libraryCount">
              0 首
            </span>
          </div>


          <form id="downloadForm" class="download-form">

            <label class="field single-url-field">
              <span>Bilibili 视频 URL</span>

              <input id="urlInput" name="url" type="url" inputmode="url" autocomplete="off"
                placeholder="https://www.bilibili.com/video/BV..." required>
            </label>


            <label class="field single-title-field">
              <span>歌曲名</span>

              <input id="titleInput" name="title" type="text" autocomplete="off" placeholder="检查后默认使用视频标题，也可以自己改">
            </label>


            <div class="form-actions">

              <button class="secondary-button" id="previewButton" type="button">
                检查
              </button>

              <button class="primary-button" id="downloadButton" type="submit">
                下载 MP3
              </button>

            </div>


            <div class="status-card" id="downloadStatus" hidden></div>

          </form>

        </div>
      </section>
      <section class="favorites-import-panel" aria-labelledby="favoritesImportTitle">
        <div class="favorites-import-card">
          <div class="favorites-import-heading">
            <div>
              <p class="eyebrow">Bilibili Favorites</p>
              <h2 id="favoritesImportTitle">一键导入收藏夹</h2>
              <p>自动创建对应播放列表 · 已有歌曲不会重复下载</p>
            </div>
          </div>

          <form id="favoriteImportForm" class="favorite-import-form">
            <label class="field">
              <span>B站收藏夹 URL</span>
              <input id="favoriteUrlInput" type="url" inputmode="url" autocomplete="off"
                placeholder="https://space.bilibili.com/.../favlist?fid=..." required>
            </label>

            <button class="primary-button" id="favoriteImportButton" type="submit">
              一键导入
            </button>
          </form>

          <div class="status-card favorite-status" id="favoriteImportStatus" hidden></div>
        </div>
      </section>
      <section class="content-surface">
        <nav class="segmented" aria-label="视图切换">
          <button class="active" type="button" data-view="library">歌曲</button>
          <button type="button" data-view="playlists">播放列表</button>
        </nav>
        <div class="status-card mobile-status global-mobile-status" id="mobileStatus" hidden></div>
        <div id="playlistSaveStatus" class="playlist-save-jobs" aria-label="播放列表保存进度" hidden></div>
        <div id="libraryView" class="view-pane">
          <div class="toolbar-row">
            <label class="search-field">
              <span class="sr-only">搜索歌曲</span>
              <input id="searchInput" type="search" placeholder="搜索歌曲">
            </label>
            <button class="secondary-button compact" type="button" id="playAllButton">播放全部</button>
          </div>
          <div class="offline-summary" id="offlineSummary">iPhone 本地：正在检查</div>
          <div id="trackList" class="track-list"></div>
        </div>

        <div id="playlistsView" class="view-pane hidden">
          <form class="playlist-form" id="playlistForm">
            <label class="field compact-field">
              <span>新播放列表</span>
              <input id="playlistNameInput" type="text" placeholder="例如：开车听">
            </label>
            <button class="primary-button compact" type="submit">创建</button>
          </form>

          <div class="playlist-layout">
            <div id="playlistList" class="playlist-list"></div>
            <div id="playlistDetail" class="playlist-detail"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <aside class="player" aria-label="播放器">
    <audio id="audio" preload="metadata"></audio>
    <div class="player-art" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="player-main">
      <div class="now-row">
        <div class="now-copy">
          <p id="nowTitle">等待播放</p>
          <span id="nowMeta">选择一首歌曲</span>
        </div>
        <button class="icon-button strong" id="playPauseButton" type="button" aria-label="播放或暂停">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path id="playPauseIcon" d="M8 5v14l11-7-11-7Z" />
          </svg>
        </button>
      </div>



      <div class="mode-row">
        <button class="icon-button" id="prevButton" type="button" aria-label="上一首">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2v12H6V6Zm3 6 9-6v12l-9-6Z" />
          </svg>
        </button>
        <button class="mode-button" type="button" data-mode="one" aria-label="单曲循环">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" />
            <text x="12" y="14.5">1</text>
          </svg>
        </button>
        <button class="mode-button active" type="button" data-mode="loop" aria-label="列表循环">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" />
          </svg>
        </button>
        <button class="mode-button" type="button" data-mode="shuffle" aria-label="随机播放">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
          </svg>
        </button>
        <button class="icon-button" id="nextButton" type="button" aria-label="下一首">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 6h2v12h-2V6ZM6 18V6l9 6-9 6Z" />
          </svg>
        </button>
      </div>

      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="progressInput" type="range" min="0" max="1000" value="0" aria-label="播放进度">
        <span id="durationTime">0:00</span>
      </div>
    </div>
  </aside>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-heading">
        <h2 id="modalTitle">设置</h2>
        <button class="icon-button" type="button" id="modalCloseButton" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z" />
          </svg>
        </button>
      </div>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="secondary-button" type="button" id="modalCancelButton">取消</button>
        <button class="primary-button" type="button" id="modalPrimaryButton">保存</button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=29" defer></script>
</body>

</html>
